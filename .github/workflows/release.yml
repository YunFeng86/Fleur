name: Release Build

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pages: write
  pull-requests: read

jobs:
  release-context:
    name: Resolve release context
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.context.outputs.should_build }}
      create_release: ${{ steps.context.outputs.create_release }}
      is_prerelease: ${{ steps.context.outputs.is_prerelease }}
      include_platform_previews: ${{ steps.context.outputs.include_platform_previews }}
      version_name: ${{ steps.context.outputs.version_name }}
      app_version: ${{ steps.context.outputs.app_version }}
      artifact_suffix: ${{ steps.context.outputs.artifact_suffix }}
      checkout_ref: ${{ steps.context.outputs.checkout_ref }}
    steps:
      - name: Resolve build mode
        id: context
        shell: bash
        run: |
          EVENT_NAME="${{ github.event_name }}"
          REF="${{ github.ref }}"
          REF_NAME="${{ github.ref_name }}"
          SHORT_SHA="${GITHUB_SHA::7}"

          SHOULD_BUILD=false
          CREATE_RELEASE=false
          IS_PRERELEASE=false
          INCLUDE_PLATFORM_PREVIEWS=false
          VERSION_NAME="manual-${SHORT_SHA}"
          APP_VERSION="0.0.0-preview.${{ github.run_number }}"
          ARTIFACT_SUFFIX="manual-${SHORT_SHA}"
          CHECKOUT_REF="${REF}"

          if [[ "${REF}" == refs/tags/v* ]]; then
            SHOULD_BUILD=true
            CREATE_RELEASE=true
            VERSION_NAME="${REF_NAME#v}"
            APP_VERSION="${VERSION_NAME}"
            ARTIFACT_SUFFIX="${VERSION_NAME}"

            if [[ "${REF_NAME}" =~ -alpha|-beta|-rc ]]; then
              IS_PRERELEASE=true
              INCLUDE_PLATFORM_PREVIEWS=true
            fi
          elif [[ "${EVENT_NAME}" == "pull_request" && "${{ github.event.pull_request.merged }}" == "true" ]]; then
            SHOULD_BUILD=true
            INCLUDE_PLATFORM_PREVIEWS=true
            VERSION_NAME="pr-${{ github.event.pull_request.number }}-${SHORT_SHA}"
            APP_VERSION="0.0.0-pr.${{ github.event.pull_request.number }}.${{ github.run_number }}"
            ARTIFACT_SUFFIX="${VERSION_NAME}"
            MERGE_SHA="${{ github.event.pull_request.merge_commit_sha }}"
            if [[ -n "${MERGE_SHA}" && "${MERGE_SHA}" != "null" ]]; then
              CHECKOUT_REF="${MERGE_SHA}"
            else
              CHECKOUT_REF="${GITHUB_SHA}"
            fi
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            SHOULD_BUILD=true
            INCLUDE_PLATFORM_PREVIEWS=true
          fi

          echo "should_build=${SHOULD_BUILD}" >> "$GITHUB_OUTPUT"
          echo "create_release=${CREATE_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "include_platform_previews=${INCLUDE_PLATFORM_PREVIEWS}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "artifact_suffix=${ARTIFACT_SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=${CHECKOUT_REF}" >> "$GITHUB_OUTPUT"

          echo "Build: ${SHOULD_BUILD}"
          echo "Create GitHub Release: ${CREATE_RELEASE}"
          echo "Prerelease: ${IS_PRERELEASE}"
          echo "Platform preview artifacts: ${INCLUDE_PLATFORM_PREVIEWS}"
          echo "Version: ${VERSION_NAME}"

  build-macos:
    name: Build macOS DMG
    needs: release-context
    if: needs.release-context.outputs.should_build == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-context.outputs.checkout_ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PUB_CACHE }}
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Calculate build variables
        id: version_vars
        shell: bash
        run: |
          BUILD_NUM="${{ github.run_number }}"
          COMMIT_HASH="$(git rev-parse --short HEAD)"
          BUILD_TIME="$(date -u "+%Y-%m-%d %H:%M UTC")"

          echo "build_number=${BUILD_NUM}" >> "$GITHUB_OUTPUT"
          echo "commit_hash=${COMMIT_HASH}" >> "$GITHUB_OUTPUT"
          echo "build_time=${BUILD_TIME}" >> "$GITHUB_OUTPUT"

      - name: Update version from tag
        if: needs.release-context.outputs.create_release == 'true'
        shell: bash
        run: |
          VERSION="${{ needs.release-context.outputs.app_version }}+${{ steps.version_vars.outputs.build_number }}"
          sed -i '' "s/^version: .*/version: ${VERSION}/" pubspec.yaml
          grep "^version:" pubspec.yaml

      - name: Generate Isar code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests
        run: flutter test
        continue-on-error: true

      - name: Build unsigned macOS release
        shell: bash
        run: |
          flutter build macos --release --config-only \
            --dart-define=APP_COMMIT_HASH="${{ steps.version_vars.outputs.commit_hash }}" \
            --dart-define=APP_BUILD_TIME="${{ steps.version_vars.outputs.build_time }}" \
            --dart-define=APP_BUILD_NUMBER="${{ steps.version_vars.outputs.build_number }}"

          xcodebuild \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -derivedDataPath build/macos \
            -destination 'generic/platform=macOS' \
            OBJROOT="$PWD/build/macos/Build/Intermediates.noindex" \
            SYMROOT="$PWD/build/macos/Build/Products" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Create DMG
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dmg_temp"
          cp -R build/macos/Build/Products/Release/Fleur.app "$GITHUB_WORKSPACE/dmg_temp/"

          hdiutil create -volname "Fleur" \
            -srcfolder "$GITHUB_WORKSPACE/dmg_temp" \
            -ov -format UDZO \
            "$GITHUB_WORKSPACE/fleur-macos.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ needs.release-context.outputs.artifact_suffix }}
          path: fleur-macos.dmg
          retention-days: 30

  build-preview-platforms:
    name: Build preview ${{ matrix.platform }}
    needs: release-context
    if: needs.release-context.outputs.include_platform_previews == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            build_args: windows --release
            artifact_name: fleur-windows-x64.zip
            archive_cmd: |
              cd build/windows/x64/runner/Release
              rm -f *.pdb
              7z a -tzip "$GITHUB_WORKSPACE/fleur-windows-x64.zip" *
          - os: ubuntu-latest
            platform: linux
            build_args: linux --release
            artifact_name: fleur-linux-x64.tar.gz
            deps_cmd: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
            archive_cmd: |
              cd build/linux/x64/release/bundle
              tar -czf "$GITHUB_WORKSPACE/fleur-linux-x64.tar.gz" *

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-context.outputs.checkout_ref }}

      - name: Install platform dependencies
        if: matrix.deps_cmd
        run: ${{ matrix.deps_cmd }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PUB_CACHE }}
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Calculate build variables
        id: version_vars
        shell: bash
        run: |
          BUILD_NUM="${{ github.run_number }}"
          COMMIT_HASH="$(git rev-parse --short HEAD)"
          BUILD_TIME="$(date -u "+%Y-%m-%d %H:%M UTC")"

          echo "build_number=${BUILD_NUM}" >> "$GITHUB_OUTPUT"
          echo "commit_hash=${COMMIT_HASH}" >> "$GITHUB_OUTPUT"
          echo "build_time=${BUILD_TIME}" >> "$GITHUB_OUTPUT"

      - name: Update version from tag
        if: needs.release-context.outputs.create_release == 'true'
        shell: bash
        run: |
          VERSION="${{ needs.release-context.outputs.app_version }}+${{ steps.version_vars.outputs.build_number }}"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            sed -i '' "s/^version: .*/version: ${VERSION}/" pubspec.yaml
          else
            sed -i "s/^version: .*/version: ${VERSION}/" pubspec.yaml
          fi
          grep "^version:" pubspec.yaml

      - name: Generate Isar code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests
        run: flutter test
        continue-on-error: true

      - name: Build ${{ matrix.platform }} release
        shell: bash
        run: |
          flutter build ${{ matrix.build_args }} \
            --dart-define=APP_COMMIT_HASH="${{ steps.version_vars.outputs.commit_hash }}" \
            --dart-define=APP_BUILD_TIME="${{ steps.version_vars.outputs.build_time }}" \
            --dart-define=APP_BUILD_NUMBER="${{ steps.version_vars.outputs.build_number }}"

      - name: Archive build artifacts
        shell: bash
        run: ${{ matrix.archive_cmd }}

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ needs.release-context.outputs.artifact_suffix }}
          path: ${{ matrix.artifact_name }}
          retention-days: 30

  build-windows-installer:
    name: Build preview Windows installer
    needs:
      - release-context
      - build-preview-platforms
    if: needs.release-context.outputs.include_platform_previews == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-context.outputs.checkout_ref }}

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-${{ needs.release-context.outputs.artifact_suffix }}
          path: windows-release

      - name: Extract Windows build
        shell: powershell
        run: |
          Get-ChildItem -Path "windows-release" -File | ForEach-Object {
            Write-Host "Downloaded: $($_.Name) - $($_.Length) bytes"
          }

          cd windows-release
          Expand-Archive -Path "fleur-windows-x64.zip" -DestinationPath "temp" -Force

          if (-not (Test-Path "temp\fleur.exe")) {
            Write-Error "Main executable not found."
            exit 1
          }

      - name: Build Windows installer script
        shell: powershell
        run: |
          if (-not (Test-Path "LICENSE")) {
            "MIT License" | Out-File -FilePath "LICENSE" -Encoding UTF8
          }

          $issContent = @"
          [Setup]
          AppName=Fleur
          AppVersion=${{ needs.release-context.outputs.app_version }}
          AppPublisher=Fleur
          AppPublisherURL=https://github.com/${{ github.repository }}
          AppSupportURL=https://github.com/${{ github.repository }}/issues
          AppUpdatesURL=https://github.com/${{ github.repository }}/releases
          DefaultDirName={autopf}\Fleur
          DefaultGroupName=Fleur
          AllowNoIcons=yes
          LicenseFile=LICENSE
          OutputBaseFilename=fleur-windows-x64-installer-${{ needs.release-context.outputs.artifact_suffix }}
          SetupIconFile=windows\runner\resources\app_icon.ico
          Compression=lzma
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesAllowed=x64
          ArchitecturesInstallIn64BitMode=x64
          MinVersion=10.0
          PrivilegesRequired=lowest

          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"

          [Tasks]
          Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"

          [Files]
          Source: "windows-release\temp\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\Fleur"; Filename: "{app}\fleur.exe"
          Name: "{group}\{cm:UninstallProgram,Fleur}"; Filename: "{uninstallexe}"
          Name: "{autodesktop}\Fleur"; Filename: "{app}\fleur.exe"; Tasks: desktopicon

          [Run]
          Filename: "{app}\fleur.exe"; Description: "{cm:LaunchProgram,Fleur}"; Flags: nowait postinstall skipifsilent
          "@

          $issContent | Out-File -FilePath "installer.iss" -Encoding UTF8

      - name: Compile Windows installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.4
        with:
          path: installer.iss
          options: /Qp

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ needs.release-context.outputs.artifact_suffix }}
          path: Output/fleur-windows-x64-installer-*.exe
          retention-days: 30
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs:
      - release-context
      - build-macos
      - build-preview-platforms
      - build-windows-installer
    if: |
      always() &&
      needs.release-context.outputs.create_release == 'true' &&
      needs.build-macos.result == 'success' &&
      (needs.build-preview-platforms.result == 'success' || needs.build-preview-platforms.result == 'skipped') &&
      (needs.build-windows-installer.result == 'success' || needs.build-windows-installer.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-context.outputs.checkout_ref }}

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        shell: bash
        run: |
          VERSION="${{ needs.release-context.outputs.artifact_suffix }}"
          mkdir -p release-files

          if [[ -f artifacts/macos-${VERSION}/fleur-macos.dmg ]]; then
            cp artifacts/macos-${VERSION}/fleur-macos.dmg "release-files/fleur-macos-${VERSION}.dmg"
          fi

          if [[ -f artifacts/windows-${VERSION}/fleur-windows-x64.zip ]]; then
            cp artifacts/windows-${VERSION}/fleur-windows-x64.zip "release-files/fleur-windows-x64-${VERSION}.zip"
          fi

          if [[ -f artifacts/windows-installer-${VERSION}/fleur-windows-x64-installer-${VERSION}.exe ]]; then
            cp artifacts/windows-installer-${VERSION}/fleur-windows-x64-installer-${VERSION}.exe "release-files/fleur-windows-x64-installer-${VERSION}.exe"
          fi

          if [[ -f artifacts/linux-${VERSION}/fleur-linux-x64.tar.gz ]]; then
            cp artifacts/linux-${VERSION}/fleur-linux-x64.tar.gz "release-files/fleur-linux-x64-${VERSION}.tar.gz"
          fi

          ls -la release-files

      - name: Generate merged changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="${TAG_NAME}" \
            --jq '.body // ""' > GENERATED_NOTES.md || true

      - name: Generate update metadata and release body
        shell: bash
        run: |
          dart tool/release/generate_update_manifest.dart \
            --tag "${{ github.ref_name }}" \
            --repository "${{ github.repository }}" \
            --release-files release-files \
            --output update-pages \
            --release-body RELEASE_BODY.md \
            --generated-notes GENERATED_NOTES.md \
            --pages-base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

      - name: Upload update metadata Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: update-pages

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ needs.release-context.outputs.is_prerelease }}
          body_path: RELEASE_BODY.md
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-update-pages:
    name: Deploy update metadata
    needs: create-release
    if: needs.create-release.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
